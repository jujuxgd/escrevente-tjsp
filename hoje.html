<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js?v=1783862902"></script>
<script src="auth-guard.js?v=1784132091"></script>
<script src="cores-early.js?v=1784060144"></script>
<script src="page-transition.js?v=1783861010"></script>
<title>Escrevente TJSP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:opsz,wght@14..32,400..700&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=1784043341">
<style>
/* ════════════════════════════════════════════
   PÁGINA HOJE — Redesign UI/UX Senior
════════════════════════════════════════════ */

/* DAY HERO — gradiente elegante, sem borda dura */
.day-hero {
  background: var(--blush);
  border-radius: var(--radius-lg);
  padding: 1.6rem 2rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 1.8rem;
  align-items: center;
  box-shadow: 0 4px 24px rgba(33, 28, 25, 0.08), 0 1px 6px rgba(33, 28, 25, 0.05);
  border: none;
  position: relative;
  overflow: hidden;
}
.day-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 85% 50%, rgba(255,255,255,0.35) 0%, transparent 60%);
  pointer-events: none;
}

.day-number-big {
  text-align: center;
  padding-right: 1.8rem;
  border-right: 1px solid var(--line);
  position: relative; z-index: 1;
}

.day-number-big .num {
  font-family: 'Fraunces', serif;
  font-size: 3.8rem;
  font-weight: 600;
  line-height: 1;
  color: var(--rose-deep);
  letter-spacing: -0.04em;
}

.day-number-big .month {
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-top: 0.35rem;
}

.day-info {
  position: relative; z-index: 1;
}

.day-info .tag {
  display: inline-block;
  background: var(--rose-soft);
  color: var(--rose-deep);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 0.28rem 0.75rem;
  border-radius: 20px;
  margin-bottom: 0.5rem;
  font-weight: 700;
}

.day-info h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.75rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin-bottom: 0.25rem;
  color: var(--ink);
}

.day-info h2 em {
  font-style: italic;
  color: var(--rose-deep);
}

.day-info .meta {
  font-size: 0.8rem;
  color: var(--ink-faded);
  line-height: 1.5;
}

/* POMODORO */
.pomodoro {
  background: linear-gradient(135deg, var(--blush) 0%, var(--rose-soft) 100%);
  padding: 1.1rem 1.3rem;
  border-radius: var(--radius);
  min-width: 210px;
  text-align: center;
  transition: background 0.6s ease;
}

.pomodoro.break-mode {
  background: linear-gradient(135deg, #e0f0d8 0%, #d0e8c8 100%);
}

.pomodoro.long-break-mode {
  background: linear-gradient(135deg, var(--lavender) 0%, #d8cce8 100%);
}

[data-theme="dark"] .pomodoro.break-mode {
  background: linear-gradient(135deg, #2a3a28 0%, #223020 100%);
}

[data-theme="dark"] .pomodoro.long-break-mode {
  background: linear-gradient(135deg, #2a2438 0%, #201a30 100%);
}

.pomodoro-mode {
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.25rem;
  font-weight: 600;
}

.pomodoro-time {
  font-family: 'Fraunces', serif;
  font-size: 2.4rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--rose-deep);
  line-height: 1;
}

.pomodoro.break-mode .pomodoro-time  { color: #4a8040; }
.pomodoro.long-break-mode .pomodoro-time { color: #6040a0; }

.pomodoro-status {
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin: 0.3rem 0;
}

.pomodoro-cycles {
  display: flex;
  gap: 0.3rem;
  justify-content: center;
  margin-bottom: 0.6rem;
}

.cycle-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--paper);
  opacity: 0.35;
  transition: all 0.3s;
}

.cycle-dot.filled { background: var(--rose-deep); opacity: 1; }
.cycle-dot.active { background: var(--rose); opacity: 1; transform: scale(1.25); }

.pomodoro-controls {
  display: flex;
  gap: 0.4rem;
  justify-content: center;
  align-items: center;
}

.pomo-btn-main {
  background: var(--paper);
  border: none;
  border-radius: var(--radius-sm);
  padding: 0.4rem 0.9rem;
  font-size: 0.72rem;
  font-family: inherit;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.05em;
}

.pomo-btn-main:hover { background: var(--rose-soft); color: var(--rose-deep); }

.pomo-btn-sm {
  background: transparent;
  border: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 0.85rem;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}

.pomo-btn-sm:hover { background: var(--paper); color: var(--ink); }

/* ── Layout principal ── */
.content-layout {
  display: grid;
  grid-template-columns: 1fr 290px;
  gap: 1.5rem;
  align-items: start;
}
/* Item de grid tem min-width:auto e não encolhe abaixo do próprio conteúdo:
   qualquer coisa larga dentro (o player de vídeo, uma tabela) estourava a
   coluna e vazava para fora da tela. */
.content-layout > * { min-width: 0; }

@media (max-width: 1100px) {
  .content-layout { grid-template-columns: 1fr; }
}

/* ── Tabs ── */
.hj-atraso { background: color-mix(in srgb, #c0504d 9%, var(--paper)); border: 1px solid color-mix(in srgb, #c0504d 35%, transparent); border-radius: var(--radius); padding: .8rem 1.1rem; margin: 0 0 1.2rem; font-size: .88rem; color: var(--ink); line-height: 1.5; }
.hj-atraso b { color: #a33f3c; }
.hj-atraso-lst { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
.hj-atraso-lst a { font-size: .78rem; font-weight: 600; text-decoration: none; color: #a33f3c; background: var(--paper); border: 1px solid color-mix(in srgb, #c0504d 35%, transparent); border-radius: 999px; padding: .3rem .7rem; }
.hj-atraso-lst a:hover { background: color-mix(in srgb, #c0504d 12%, var(--paper)); }
[data-theme="dark"] .hj-atraso b, [data-theme="dark"] .hj-atraso-lst a { color: #e8908c; }

.tabs-bar {
  display: flex;
  gap: 0.35rem;
  background: var(--bg-soft);
  padding: 0.35rem;
  border-radius: var(--radius);
  margin-bottom: 1.2rem;
  border: 1px solid var(--line);
}

.tab {
  flex: 1;
  padding: 0.7rem 0.8rem;
  font-size: 0.85rem;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-align: center;
  border-radius: var(--radius-sm);
  color: var(--ink-faded);
  transition: all var(--transition);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  white-space: nowrap;
}

.tab:hover { background: var(--blush); color: var(--ink); }

.tab.active {
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
  color: var(--paper);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(44, 36, 32, 0.12);
}

.tab .badge {
  background: var(--paper);
  color: var(--rose-deep);
  font-size: 0.62rem;
  padding: 0.1rem 0.45rem;
  border-radius: 10px;
  font-weight: 700;
}
.tab.active .badge { background: rgba(255,255,255,0.25); color: white; }

/* Com 5 abas, telas estreitas não têm espaço pra caber tudo lado a lado.
   A barra quebra em duas linhas: rolar na horizontal escondia as últimas
   abas atrás de uma rolagem sem barra visível, e não havia nada na tela
   dizendo que dava pra arrastar. */
@media (max-width: 700px) {
  .tabs-bar { flex-wrap: wrap; overflow-x: visible; row-gap: 0.3rem; }
  .tab { flex: 0 1 auto; padding: 0.65rem 0.9rem; }
}

.tab-content {
  display: none;
  animation: fadeInUp 0.3s ease;
}
.tab-content.active { display: block; }

/* ── Questões / Revisões (registros unificados) ── */
.qr-form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;min-width:0}
@media(max-width:600px){.qr-form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.qr-form-grid{grid-template-columns:1fr}}
.qr-form-grid > *{min-width:0}
.qr-input{width:100%;box-sizing:border-box;padding:.6rem .75rem;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.88rem;font-family:inherit;background:var(--paper);color:var(--ink)}
.qr-hist-table{width:100%;border-collapse:collapse;font-size:.82rem}
.qr-hist-table th{text-align:left;color:var(--ink-faded);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
.qr-hist-table td{padding:.5rem;border-bottom:1px dotted var(--line)}
.qr-empty{color:var(--ink-faded);font-style:italic;font-size:.85rem;padding:.6rem 0}

/* ── Revisões: escolha Questões x Teoria ── */
.rv-tipo-escolha{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(max-width:480px){.rv-tipo-escolha{grid-template-columns:1fr}}
.rv-tipo-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;
  padding:.9rem 1rem;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--paper);cursor:pointer;font-family:'Inter',sans-serif;font-size:.92rem;
  font-weight:600;color:var(--ink);transition:all var(--transition)
}
.rv-tipo-btn span{font-size:.72rem;font-weight:400;color:var(--ink-faded)}
.rv-tipo-btn:hover{border-color:var(--rose)}
.rv-tipo-btn.active{border-color:var(--rose-deep);background:var(--blush)}
.rv-conf-escolha{display:flex;gap:.5rem;flex-wrap:wrap}
.rv-conf-btn{
  padding:.5rem .9rem;border:1.5px solid var(--line);border-radius:20px;background:var(--paper);
  cursor:pointer;font-family:'Inter',sans-serif;font-size:.8rem;color:var(--ink-soft);
  transition:all var(--transition)
}
.rv-conf-btn:hover{border-color:var(--rose)}
.rv-conf-btn.active{border-color:var(--rose-deep);background:var(--blush);color:var(--rose-deep);font-weight:600}
.tr-topicos-list{display:flex;flex-direction:column;gap:.4rem;max-height:220px;overflow-y:auto;padding:.2rem}
.tr-topico-item{display:flex;align-items:flex-start;gap:.5rem;font-size:.82rem;color:var(--ink);cursor:pointer}
.tr-topico-item input{margin-top:.2rem;accent-color:var(--rose-deep)}

/* ── PDF da semana embutido ── */
.pdf-embed-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.pdf-embed-bar{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.pdf-embed-title{font-size:.8rem;font-weight:600;color:var(--ink)}
.pdf-embed-iframe{width:100%;height:75vh;border:none;display:block}

/* ── Main content card ── */
.content-card {
  background: var(--paper);
  border-radius: var(--radius-lg);
  padding: 1.8rem 2rem;
  border: 1px solid var(--line);
  box-shadow: 0 2px 12px rgba(44, 36, 32,0.07), 0 1px 3px rgba(0,0,0,0.04);
}

.highlight-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  padding: 0.7rem 1rem;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
}

.highlight-bar .label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-right: 0.4rem;
}

.color-pick {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: var(--ink-soft);
}

.color-pick:hover { transform: scale(1.15); }
.color-pick.active { border-color: var(--ink); box-shadow: var(--shadow-sm); }

.c1 { background: var(--highlight-1); }
.c2 { background: var(--highlight-2); }
.c3 { background: var(--highlight-3); }
.c4 { background: var(--highlight-4); }

.hl-1 { background: var(--highlight-1); padding: 0 3px; border-radius: 3px; }
.hl-2 { background: var(--highlight-2); padding: 0 3px; border-radius: 3px; }
.hl-3 { background: var(--highlight-3); padding: 0 3px; border-radius: 3px; }
.hl-4 { background: var(--highlight-4); padding: 0 3px; border-radius: 3px; }

.teoria h3 {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  font-weight: 500;
  margin: 1.8rem 0 1rem;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.teoria h3:first-of-type { margin-top: 0; }

.teoria h3 em {
  font-style: italic;
  color: var(--rose-deep);
}

.teoria p {
  margin-bottom: 1rem;
  font-size: 1.12rem;
  color: var(--ink-soft);
  line-height: 1.82;
}

.teoria .drop-cap::first-letter {
  font-family: 'Fraunces', serif;
  font-size: 3rem;
  font-weight: 600;
  float: left;
  line-height: 0.9;
  padding: 0.3rem 0.8rem 0 0;
  color: var(--rose-deep);
  font-style: italic;
}

.callout {
  padding: 1.2rem 1.5rem;
  border-radius: var(--radius);
  margin: 1.5rem 0;
  position: relative;
}

.callout.attention {
  background: linear-gradient(135deg, var(--blush) 0%, var(--rose-soft) 100%);
  border-left: 4px solid var(--rose-deep);
}

.callout.tip {
  background: linear-gradient(135deg, var(--champagne) 0%, var(--nude) 100%);
  border-left: 4px solid var(--gold);
}

.callout .icon-label {
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 0.4rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.callout p {
  margin: 0;
  font-size: 0.9rem;
  color: var(--ink);
}

/* QUESTÕES */
.questao {
  background: var(--paper-tint);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.8rem;
  margin-bottom: 1.2rem;
}

.questao-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}

.questao-head .num {
  background: var(--rose-soft);
  color: var(--rose-deep);
  padding: 0.2rem 0.7rem;
  border-radius: 20px;
  font-weight: 600;
}

.questao-text {
  font-size: 1.0rem;
  color: var(--ink);
  margin-bottom: 1.3rem;
  line-height: 1.7;
}

.alternativas {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.alternativa {
  padding: 0.9rem 1.2rem;
  border: 1px solid var(--line);
  background: var(--paper);
  cursor: pointer;
  display: flex;
  gap: 0.9rem;
  align-items: flex-start;
  font-size: 0.96rem;
  transition: all var(--transition);
  border-radius: var(--radius-sm);
}

.alternativa:hover {
  background: var(--bg-soft);
  border-color: var(--rose);
  transform: translateX(2px);
}

.alternativa.selected {
  border-color: var(--rose);
  background: var(--rose-soft);
}

.alternativa.correct {
  border-color: var(--success);
  background: rgba(168, 184, 154, 0.15);
}

.alternativa.incorrect {
  border-color: var(--error);
  background: rgba(201, 137, 126, 0.15);
}

.alternativa .letra {
  font-family: 'Fraunces', serif;
  font-size: 1.1rem;
  font-weight: 600;
  font-style: italic;
  color: var(--rose-deep);
  min-width: 24px;
}

.gabarito {
  margin-top: 1.2rem;
  padding: 1.2rem 1.4rem;
  background: var(--bg-soft);
  border-left: 3px solid var(--success);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  display: none;
  color: var(--ink);
}

.gabarito.show { display: block; animation: fadeInUp 0.3s ease; }

.gabarito .label {
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--success);
  font-weight: 700;
  margin-bottom: 0.5rem;
  display: block;
}

[data-theme="dark"] .gabarito .label { color: #b8c9a8; }

.questao-actions {
  display: flex;
  gap: 0.6rem;
  margin-top: 1rem;
}

/* ── Sidebar direita ── */
.side {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  position: sticky;
  top: 1.5rem;
}

.side-block {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.5rem;
  box-shadow: 0 2px 12px rgba(44, 36, 32,0.07), 0 1px 3px rgba(0,0,0,0.04);
  transition: box-shadow var(--transition);
}

.side-block:hover {
  box-shadow: 0 4px 20px rgba(44, 36, 32,0.11), 0 2px 6px rgba(0,0,0,0.05);
}

.side-block h4 {
  font-family: 'Fraunces', serif;
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.side-block h4 .icon {
  font-size: 0.85rem;
  color: var(--rose-deep);
  opacity: 0.75;
}

/* ── Checklist ── */
.checklist { list-style: none; }
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.65rem 0;
  font-size: 0.83rem;
  line-height: 1.5;
  cursor: pointer;
  border-bottom: 1px solid var(--line-soft);
  transition: all var(--transition);
  color: var(--ink-soft);
}
.checklist li:last-child { border-bottom: none; }
.checklist li:hover { color: var(--ink); }

/* Meta do dia — idêntica aos itens do checklist (sem herdar serifa/peso) */
#meta-texto {
  font-family: 'Inter', sans-serif !important;
  font-size: 0.83rem !important;
  font-weight: 400 !important;
  line-height: 1.5 !important;
  letter-spacing: 0 !important;
}

.checklist .check {
  width: 18px; height: 18px;
  flex-shrink: 0;
  border: 1.5px solid var(--ink-ghost);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  border-radius: 4px;
  transition: all var(--transition);
  color: var(--paper);
  margin-top: 2px;
}

.checklist li:hover .check { border-color: var(--rose); }

.checklist li.done .check {
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
  border-color: var(--rose);
}

.checklist li.done {
  text-decoration: line-through;
  color: var(--ink-ghost);
}

/* CAI NA OAB */
.cai-card {
  background: var(--paper-tint);
  border: 1px solid var(--line);
  padding: 1rem 1.2rem;
  border-radius: var(--radius);
  margin-top: 0.8rem;
}

.cai-card .freq {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  font-style: italic;
  color: var(--rose-deep);
  font-weight: 500;
}

.cai-card .freq small {
  font-size: 0.85rem;
  color: var(--ink-faded);
  font-style: normal;
}

.cai-card .desc {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 0.4rem;
  line-height: 1.5;
}

/* COMENTÁRIOS */
.comment-area {
  background: var(--bg-soft);
  padding: 1.5rem;
  border-radius: var(--radius);
  border: 1px dashed var(--line);
}

.comment {
  background: var(--paper);
  padding: 1rem 1.2rem;
  margin-bottom: 0.8rem;
  border-left: 3px solid var(--rose);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}

.comment .meta {
  font-size: 0.7rem;
  color: var(--ink-faded);
  letter-spacing: 0.08em;
  margin-bottom: 0.4rem;
}

.comment .body {
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 0.88rem;
  color: var(--ink);
  line-height: 1.55;
}

/* RESUMO */
.resumo-box {
  background: linear-gradient(135deg, var(--blush) 0%, var(--rose-soft) 100%);
  padding: 1.8rem;
  border-radius: var(--radius);
  position: relative;
  margin-top: 1rem;
}

.resumo-box::before {
  content: '✦';
  position: absolute;
  top: -10px;
  left: 1.8rem;
  background: var(--paper);
  padding: 0 0.6rem;
  color: var(--rose-deep);
  border-radius: 50%;
  border: 1px solid var(--line);
}

.resumo-text {
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 0.9rem;
  color: var(--ink);
  line-height: 1.65;
}

/* DAY FOOTER */
.day-footer {
  margin-top: 1.5rem;
  padding: 1.2rem 1.5rem;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px rgba(44, 36, 32,0.06);
}

.day-nav {
  display: flex;
  gap: 1rem;
}

.day-nav a {
  text-decoration: none;
  color: var(--ink-soft);
  font-size: 0.85rem;
  transition: color var(--transition);
}

.day-nav a:hover { color: var(--rose-deep); }

.btn-estudei {
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
  color: white;
  border: none;
  padding: 0.85rem 2rem;
  font-size: 0.8rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  font-family: inherit;
  border-radius: var(--radius);
  font-weight: 700;
  transition: all var(--transition);
  box-shadow: var(--shadow);
}

.btn-estudei:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

/* Toast de avanço de dia — topo central: embaixo cobria outras caixas
   de texto da página (ex.: microresumo, formulário de questões) */
/* Toast "a seguir" — ação de navegar pro próximo dia. Fica embaixo,
   centralizado, separado do toast de parabéns (canto superior) pra não
   virarem uma coisa só cheia de informação. */
.day-toast {
  position: fixed;
  bottom: 1.4rem;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 1.2rem 1.8rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
  z-index: 9000;
  min-width: 320px;
  max-width: 480px;
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(30px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.day-toast.hiding {
  animation: toastOut 0.3s ease forwards;
}

@keyframes toastOut {
  to { opacity: 0; transform: translateX(-50%) translateY(20px); }
}

.toast-icon { font-size: 1.8rem; flex-shrink: 0; }
.toast-text { flex: 1; }
.toast-text strong { display: block; font-family:'Fraunces',serif; font-size:0.95rem; color:var(--ink); }
.toast-text span { font-size:0.78rem; color:var(--ink-faded); }
.toast-progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--rose), var(--rose-deep));
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  animation: toastTimer 5s linear forwards;
}
@keyframes toastTimer { from { width: 100%; } to { width: 0%; } }

/* Toast "parabéns" — só a confirmação, curtinha, canto superior, some
   sozinha. Não tem botão nem ação — essa parte fica no toast de baixo. */
.day-toast-parabens {
  position: fixed;
  top: 1.4rem;
  right: 1.4rem;
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  color: var(--paper);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  z-index: 9000;
  font-family: 'Fraunces', serif;
  font-size: 0.88rem;
  font-weight: 600;
  animation: parabensIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes parabensIn {
  from { opacity: 0; transform: translateY(-16px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.day-toast-parabens.hiding { animation: parabensOut 0.3s ease forwards; }
@keyframes parabensOut { to { opacity: 0; transform: translateY(-12px) scale(0.96); } }
@media (max-width: 560px) {
  .day-toast-parabens { top: 0.8rem; right: 0.8rem; left: 0.8rem; justify-content: center; }
}

/* Modo foco: usa Focus Dashboard Layout de style.css (classes .focus-overlay / .focus-panel) */

/* VDE content — leitura confortável da teoria */
.vde-content  { font-size: 1.08rem !important; line-height: 1.84 !important; }
.vde-h2       { font-size: 1.4rem !important; }
.vde-h3       { font-size: 1.18rem !important; }

.vde-table td { font-size: 1.0rem !important; line-height: 1.61 !important; padding: 0.52rem 0.78rem !important; }

/* Conteúdo do dia — texto forte (quase preto) e quadrados em bege clarinho */
.vde-content, .vde-content p, .vde-content li,
.vde-list li, .vde-table td, .vde-texto, .vde-label { color: var(--ink) !important; }
.vde-block    { background: #faf9f7 !important; border-left-color: var(--rose-soft) !important; }
[data-theme="dark"] .vde-block { background: var(--bg-soft) !important; }
.vde-caiu     { color: var(--ink-faded) !important; }

/* Aula concluída */
.va-row-done { opacity: 0.6; }
.va-row-done .va-check-btn { color: #4a9850 !important; }

/* ── Painéis de matéria ── */
.subject-panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1rem;
  box-shadow: 0 2px 10px rgba(44, 36, 32,0.06), 0 1px 3px rgba(0,0,0,0.04);
  transition: box-shadow var(--transition);
}
.subject-panel:hover {
  box-shadow: 0 4px 16px rgba(44, 36, 32,0.10), 0 2px 5px rgba(0,0,0,0.05);
}

.subject-panel-header {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1rem 1.3rem;
  cursor: pointer;
  user-select: none;
  transition: filter var(--transition);
}
.subject-panel-header:hover { filter: brightness(0.96); }

.subject-panel-header .sp-emoji { font-size: 1.15rem; }
.subject-panel-header .sp-nome  { font-family:'Fraunces',serif; font-size:0.98rem; font-weight:600; flex:1; letter-spacing:-0.01em; }
.subject-panel-header .sp-horas { font-size:0.68rem; color:var(--ink-faded); letter-spacing:0.08em; }
.subject-panel-header .sp-toggle { font-size:0.85rem; color:var(--ink-faded); transition:transform 0.3s; }
.subject-panel.collapsed .sp-toggle { transform: rotate(-90deg); }

/* Cores dos headers por matéria */
.sp-rose     { background: linear-gradient(135deg, var(--blush), var(--rose-soft)); }
.sp-lavender { background: linear-gradient(135deg, var(--lavender), var(--blush)); }
.sp-champagne{ background: linear-gradient(135deg, var(--champagne), var(--nude)); }
.sp-sage     { background: linear-gradient(135deg, var(--sage), var(--bg-deep)); }

/* --sage, --champagne e --lavender não escurecem no modo escuro (ficam com
   a mesma saturação clara/média em ambos os temas) — por isso o texto precisa
   de uma cor fixa e escura aqui, em vez de herdar --ink (que vira claro
   no modo escuro e some sobre esse fundo). */
.sp-sage .sp-nome, .sp-sage .sp-horas, .sp-sage .sp-toggle,
.sp-champagne .sp-nome, .sp-champagne .sp-horas, .sp-champagne .sp-toggle,
.sp-lavender .sp-nome, .sp-lavender .sp-horas, .sp-lavender .sp-toggle {
  color: #211C19;
}
.sp-sage .sp-horas, .sp-champagne .sp-horas, .sp-lavender .sp-horas,
.sp-sage .sp-toggle, .sp-champagne .sp-toggle, .sp-lavender .sp-toggle { opacity: 0.72; }

/* Botão expandir painel */
.sp-expand-btn {
  background: rgba(255,255,255,0.55);
  border: none;
  border-radius: var(--radius-sm);
  padding: 0.25rem 0.55rem;
  font-size: 0.72rem;
  cursor: pointer;
  color: var(--ink-soft);
  transition: all var(--transition);
  margin-right: 0.4rem;
  white-space: nowrap;
  flex-shrink: 0;
}
.sp-expand-btn:hover { background: white; color: var(--rose-deep); }

/* ── Checklist granular (tópicos por matéria) ─ */
/* ── Preview cards de revisão (aba Resumo) ─── */
.resumo-prev-card {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin-bottom: 0.9rem;
}
.resumo-prev-head {
  display: flex;
  align-items: center;

}
.resumo-prev-nome {
  font-family: 'Fraunces', serif;
  font-size: 1rem;

}
.resumo-prev-list {

}
.resumo-prev-list li {

  color: var(--ink-soft);
  border-bottom: 1px dotted var(--line);
  position: relative;
  line-height: 1.4;
}
.resumo-prev-list li:last-child { border-bottom: none; }
.resumo-prev-list li::before {
  content: '✦';
  position: absolute;
  left: 0;
  color: var(--rose-deep);
  font-size: 0.6rem;

}

/* ── Checklist granular ─────────────────────── */
.checklist-group-header {
  font-size: 0.63rem;
  letter-spacing: 0.16em;

  color: var(--rose-deep);

  gap: 0.35rem;
}

/* Macrotema — subdivisão dentro de uma matéria (índice de capítulo) */
.checklist-subgroup-header {
  font-family: 'Fraunces', serif;
  font-size: 0.8rem;
  font-weight: 500;

  color: var(--ink-soft);

}

<script>
(function () {
  var S = SESSAO, DIA = S.DIA, esc = S.esc;
  var ABAS = ['conteudo', 'flashcards', 'questoes', 'checklist'];
  var aba = new URLSearchParams(location.search).get('aba');
  if (ABAS.indexOf(aba) < 0) aba = S.pdfsDoDia().length || S.revisoesDoDia().length ? 'conteudo' : 'flashcards';
  var feitas = {};

  function abrir(a) {
    aba = a;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === a); });
    document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.toggle('active', c.dataset.tab === a); });
    var u = new URL(location.href); u.searchParams.set('aba', a); history.replaceState(null, '', u);
    if (!feitas[a]) {
      feitas[a] = 1;
      if (a === 'conteudo') S.montarConteudo(document.getElementById('ct-area'));
      if (a === 'questoes') S.montarQuestoes(document.getElementById('q-area'));
      if (a === 'videoaulas') montarVideoaulas();
    }
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { abrir(t.dataset.tab); }); });
  S.sincPasta(function (ns) {
    var meus = S.pdfsDoDia().some(function (p) { return ns.indexOf(p.n) >= 0; });
    if (meus && feitas.conteudo) S.montarConteudo(document.getElementById('ct-area'));
  });

  function cabecalho() {
    var p = S.partes(S.DATA);
    document.getElementById('hj-data').textContent = S.dataLonga(S.DATA) + (S.DATA !== S.HOJE ? (S.HOJE < CAL_ATIVO.dias[0].d && S.indice() === 0 ? ' · o plano começa neste dia' : S.DATA < S.HOJE ? ' · dia passado' : ' · dia futuro') : '');
    document.getElementById('hj-n').textContent = S.indice() + 1;
    document.getElementById('hj-total').textContent = CAL_ATIVO.dias.length;
    document.getElementById('hj-dia').textContent = p.d;
    document.getElementById('hj-mes').textContent = S.MESES[p.m - 1];
    if (!DIA) return;
    var fase = DIA.f === 1 ? (DIA.ritmo === 'leve' ? 'Ritmo leve' : 'Férias') : DIA.f === 3 ? 'Reta final' : 'Prova';
    document.getElementById('day-materia-tag').textContent = fase + ' · ' + (S.TIPO[DIA.tipo] || '');
    document.getElementById('day-titulo-h2').innerHTML = DIA.top
      ? DIA.top.map(function (t) { return esc(S.curto(t.d)) + ': ' + esc(t.s); }).join(' <em>·</em> ')
      : esc(S.resumoDoDia());
    document.getElementById('hj-tema').textContent = DIA.top
      ? (S.DATA === S.HOJE ? 'Hoje: ' : '') + S.disciplinasDoDia().map(S.curto).join(' e ')
      : S.TIPO[DIA.tipo] || 'Hoje';
    document.getElementById('hj-cont').textContent = Math.max(0, Math.round((new Date(2027, 2, 14) - new Date(S.DATA + 'T00:00:00')) / 864e5));
    document.getElementById('day-meta').textContent = S.disciplinasDoDia().map(S.curto).join(' + ');
    var prev = S.vizinho(-1), next = S.vizinho(1);
    var np = document.getElementById('nav-prev'), nn = document.getElementById('nav-next');
    if (prev) np.href = 'hoje.html?data=' + prev; else np.style.visibility = 'hidden';
    if (next) nn.href = 'hoje.html?data=' + next; else nn.style.visibility = 'hidden';
    if (S.DATA === S.HOJE) np.textContent = '← Ontem', nn.textContent = 'Amanhã →';
    if (S.DATA < S.HOJE) document.getElementById('btn-estudei').textContent = 'Marcar como estudado ✦';
    if (S.feito()) estudeiOn();
    avisoAtraso();
  }

  function avisoAtraso() {
    var el = document.getElementById('hj-atraso'), at = S.atrasados();
    if (S.DATA < S.HOJE && at.indexOf(S.DATA) >= 0) {
      el.innerHTML = '<div class="hj-atraso"><b>Dia atrasado.</b> Faça o conteúdo e marque “Marcar como estudado” para tirá-lo da lista.</div>';
      return;
    }
    if (S.DATA !== S.HOJE || !at.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="hj-atraso"><b>' + at.length + (at.length === 1 ? ' dia atrasado' : ' dias atrasados') + '</b> · faça quando puder:' +
      '<span class="hj-atraso-lst">' + at.map(function (d) {
        var p = S.partes(d);
        return '<a href="hoje.html?data=' + d + '">' + p.d + '/' + String(p.m).padStart(2, '0') + ' · ' + esc(curtoDia(d)) + '</a>';
      }).join('') + '</span></div>';
  }
  function curtoDia(d) {
    var x = CAL_ATIVO.dias.filter(function (y) { return y.d === d; })[0];
    if (!x) return '';
    if (x.top) return S.curto(x.top[0].d) + (x.top.length > 1 && x.top[1].d !== x.top[0].d ? ' + ' + S.curto(x.top[1].d) : '');
    return S.TIPO[x.tipo] || '';
  }

  function montarFlashcards() {
    var f = S.fila(), cart = f.venc.concat(f.novos);
    var intro = document.getElementById('fc-intro');
    if (DIA && DIA.tipo === 'prova') { intro.textContent = 'Boa prova! Escrevente Técnico Judiciário · TJSP. Nada novo hoje.'; return; }
    intro.innerHTML = cart.length
      ? 'Primeiro os <b>' + f.venc.length + '</b> vencidos, depois <b>' + f.novos.length + '</b> novos' +
        (f.novos.length ? ' de ' + esc(uniq(f.novos.map(function (c) { return S.curto(c.d); })).join(', ')) : '') +
        '. Leia a frente, tente lembrar, mostre a resposta e marque <b>errei</b>, <b>difícil</b>, <b>bom</b> ou <b>fácil</b> — cada botão mostra quando o cartão volta.'
      : f.feitos.length ? 'Você já fez os <b>' + f.feitos.length + '</b> flashcards novos de hoje. Quer revisar mais? Abra <a href="revisar.html">Revisar</a> e escolha a matéria.'
      : 'Nenhum flashcard para hoje. Quer revisar mais? Abra <a href="revisar.html">Revisar</a> e escolha a matéria.';
    S.montarFlashcards(document.getElementById('fc-area'), cart, {
      vazio: f.feitos.length ? 'Flashcards de hoje concluídos ✓' : 'Sem flashcards para hoje.',
      fim: function () { S.marcar('fc', true); }
    });
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }

  function montarChecklist() {
    document.getElementById('ck-area').innerHTML = S.htmlChecklist();
    atualizarContador();
    var n = typeof erros_total_devidas === 'function' ? Math.min(erros_total_devidas(), ERROS_LIMITE_DIARIO) : 0;
    if (n && !(DIA && DIA.tipo === 'revisao')) document.getElementById('ck-cad').innerHTML =
      '<div class="ss-bloco"><h3>Extra · Caderno de erros</h3><p>' + n + (n === 1 ? ' erro vence' : ' erros vencem') +
      ' hoje (questões erradas em dias anteriores).</p><div class="ss-acoes"><a class="btn" href="erros.html">Revisar no caderno</a></div></div>';
  }
  function faixa() {
    var el = document.getElementById('pl-faixa'); if (!el || !DIA || DIA.tipo === 'prova') { if (el) el.remove(); return; }
    var f = S.fila(), nfc = f.venc.length + f.novos.length, c = S.itensChecklist(), ck = {};
    var feitos = (function () { try { return (JSON.parse(localStorage.getItem('tj_ativo_check_v1')) || {})[S.DATA] || {}; } catch (e) { return {}; } })();
    c.forEach(function (x) { ck[x.id] = !!feitos[x.id]; });
    var tops = (DIA.top || []).map(function (t, i) { return 't' + i; }), nq = tops.length * ATIVO.questoesPorTopico() || (DIA.tipo === 'revisao' ? 20 : DIA.tipo === 'leve' ? 10 : 0);
    var ne = typeof erros_total_devidas === 'function' ? Math.min(erros_total_devidas(), ERROS_LIMITE_DIARIO) : 0;
    var peca = function (n, tit, sub, ok, aba) {
      return '<a class="pl-peca" href="hoje.html?data=' + S.DATA + '&aba=' + aba + '" data-aba="' + aba + '"><b>' + n + '</b><div><h4>' + tit + '</h4><p>' + sub + '</p></div><i' + (ok ? ' class="v"' : '') + '></i></a>';
    };
    el.innerHTML = peca(nfc, 'Flashcards', 'para revisar hoje', ck.fc, 'flashcards') +
      peca(nq, 'Questões', 'das matérias do dia', tops.length ? tops.every(function (k) { return ck[k]; }) : ck.etica, 'questoes') +
      '<a class="pl-peca" href="erros.html"><b>' + ne + '</b><div><h4>Erros</h4><p>para refazer</p></div><i' + (ne ? '' : ' class="v"') + '></i></a>';
    el.onclick = function (ev) { var a = ev.target.closest('[data-aba]'); if (!a) return; ev.preventDefault(); abrir(a.dataset.aba); document.querySelector('.tabs-bar').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  }
  document.addEventListener('sessao:checklist', faixa);
  function atualizarContador() {
    var p = S.progressoChecklist();
    document.getElementById('ck-cont').textContent = p.total ? p.feitos + '/' + p.total : '';
    document.getElementById('ck-txt').textContent = p.feitos + ' de ' + p.total + ' feitos';
    document.getElementById('ck-bar').style.width = (p.total ? p.feitos / p.total * 100 : 0) + '%';
  }
  document.addEventListener('sessao:checklist', atualizarContador);

  // ── Estudei hoje: marca o dia no calendário e conta no streak ──
  function estudeiOn() {
    var b = document.getElementById('btn-estudei');
    b.classList.add('concluido'); b.textContent = '✓ Dia Concluído';
  }
  window.toggleDiaConcluido = function () {
    var b = document.getElementById('btn-estudei');
    if (S.feito()) { S.marcarFeito(false); b.classList.remove('concluido'); b.textContent = S.DATA < S.HOJE ? 'Marcar como estudado ✦' : 'Estudei Hoje ✦'; avisoAtraso(); if (window.atualizarStreak) atualizarStreak(); return; }
    S.marcarFeito(true); estudeiOn(); avisoAtraso(); if (window.atualizarStreak) atualizarStreak();
    if (S.DATA === S.HOJE && typeof baterMetaDoDia === 'function') baterMetaDoDia();
    else if (typeof showPetals === 'function') showPetals();
  };

  // ── Videoaulas das matérias do dia ──
  function vaKey(nome) {
    var n = (nome || '').toLowerCase();
    if (n.indexOf('ética') > -1) return 'etica';
    if (n.indexOf('processual penal') > -1) return 'proc_penal';
    if (n.indexOf('processual do trab') > -1) return 'proc_trabalho';
    if (n.indexOf('processual civil') > -1) return 'proc_civil';
    if (n.indexOf('constitucional') > -1) return 'constitucional';
    if (n.indexOf('administrativo') > -1) return 'administrativo';
    if (n.indexOf('tributário') > -1) return 'tributario';
    if (n.indexOf('empresarial') > -1) return 'empresarial';
    if (n.indexOf('consumidor') > -1) return 'cdc';
    if (n.indexOf('previdenc') > -1) return 'previdenciario';
    if (n.indexOf('eleitoral') > -1) return 'eleitoral';
    if (n === 'eca') return 'eca';
    if (n.indexOf('penal') > -1) return 'penal';
    if (n.indexOf('trabalho') > -1) return 'trabalho';
    if (n.indexOf('civil') > -1) return 'civil';
    return null;
  }
  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var STOP = ['de','da','do','das','dos','e','em','no','na','nos','nas','com','para','por','sem','sob','as','os','ao','aos','um','uma','que','parte','geral','tipos','revisao','questoes','introducao','conceito','conceitos','reforco','direito'];
  function tokens(s) { return norm(s).replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 4 && STOP.indexOf(w) < 0; }); }
  window.vaAbrirPlayer = function (url, titulo) {
    var w = document.getElementById('va-player-wrap');
    document.getElementById('va-player-frame').src = url;
    document.getElementById('va-player-titulo').textContent = titulo || 'Videoaula';
    w.style.display = ''; w.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  window.vaFecharPlayer = function () {
    document.getElementById('va-player-frame').src = '';
    document.getElementById('va-player-wrap').style.display = 'none';
  };
  function montarVideoaulas() {
    var lista = document.getElementById('va-lista');
    var discs = S.disciplinasDoDia();
    if (!discs.length || typeof VIDEOAULAS === 'undefined') { lista.innerHTML = '<p class="ss-vazio">Sem videoaulas para este dia.</p>'; return; }
    var temas = {};
    (DIA.top || []).forEach(function (t) { (temas[t.d] = temas[t.d] || []).push(t.s); (t.q || []).forEach(function (x) { temas[t.d].push(x); }); });
    lista.innerHTML = discs.map(function (d) {
      var key = vaKey(d), dados = key ? VIDEOAULAS[key] : null;
      var dia = {}; (temas[d] || []).forEach(function (t) { tokens(t).forEach(function (w) { dia[w] = 1; }); });
      var stopMat = tokens(d);
      var h = '<div style="display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:linear-gradient(135deg,var(--blush),var(--rose-soft));border-radius:var(--radius);margin:.4rem 0 .7rem">' +
        '<div style="flex:1"><div style="font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--rose-deep);font-weight:700">Videoaulas · ' + esc(S.dataLonga(S.DATA)) + '</div>' +
        '<div style="font-family:\'Fraunces\',serif;font-size:1.05rem;font-weight:500;color:var(--ink)">' + esc(d) + '</div></div></div>';
      if (!dados || !dados.aulas || !dados.aulas.length) return h + '<p class="ss-vazio">Sem videoaulas cadastradas para esta matéria.</p>';
      return h + dados.aulas.map(function (a) {
        var tk = tokens(a.titulo).filter(function (w) { return stopMat.indexOf(w) < 0; });
        var hits = tk.filter(function (w) { return dia[w]; }).length;
        var rel = tk.length > 0 && hits >= Math.max(1, Math.ceil(tk.length * 0.6));
        var dk = 'va_done_' + key + '_' + a.n, done = !!localStorage.getItem(dk);
        return '<div class="va-row' + (done ? ' va-row-done' : '') + '" data-url="' + esc(a.url) + '" data-tit="' + esc(d + ' · Aula ' + a.n + ': ' + a.titulo) + '" style="display:flex;align-items:center;gap:.8rem;padding:.65rem .9rem;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:.35rem;border:1px solid ' + (rel && !done ? 'var(--rose-soft)' : 'var(--line)') + ';background:' + (done ? 'var(--bg-soft)' : rel ? 'var(--blush)' : 'var(--paper)') + '">' +
          '<span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:white;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700">▶</span>' +
          '<div style="flex:1;min-width:0"><div style="font-size:.7rem;color:var(--ink-faded)">Aula ' + a.n + (rel ? ' · <span style="color:var(--rose-deep);font-weight:700">tópico do dia</span>' : '') + '</div>' +
          '<div style="font-size:.88rem;color:var(--ink);font-weight:500;line-height:1.3">' + esc(a.titulo) + '</div></div>' +
          '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" title="Abrir em nova aba" style="font-size:.72rem;color:var(--ink-faded);text-decoration:none;padding:.2rem .4rem">↗</a>' +
          '<button class="va-check-btn" data-dk="' + dk + '" title="' + (done ? 'Marcar como não vista' : 'Marcar como concluída') + '" style="background:none;border:1.5px solid ' + (done ? '#4a9850' : 'var(--line)') + ';border-radius:50%;width:28px;height:28px;flex-shrink:0;font-size:.8rem;cursor:pointer;color:' + (done ? '#4a9850' : 'var(--ink-faded)') + '">' + (done ? '✓' : '○') + '</button></div>';
      }).join('');
    }).join('<div style="height:.6rem"></div>');
  }
  document.getElementById('va-lista').addEventListener('click', function (ev) {
    if (ev.target.closest('a')) return;
    var b = ev.target.closest('.va-check-btn');
    if (b) {
      var dk = b.dataset.dk, on = !localStorage.getItem(dk);
      try {
        if (on) localStorage.setItem(dk, '1'); else localStorage.removeItem(dk);
        localStorage.setItem('tj_local_rev', String(Date.now()));
        if (window._syncOAB && window._syncOAB.notificarAlteracaoLocal) window._syncOAB.notificarAlteracaoLocal(dk);
      } catch (e) {}
      feitas.videoaulas = 0; montarVideoaulas(); feitas.videoaulas = 1;
      return;
    }
    var row = ev.target.closest('.va-row');
    if (row) vaAbrirPlayer(row.dataset.url, row.dataset.tit);
  });

  document.addEventListener('DOMContentLoaded', function () {
    cabecalho();
    montarChecklist();
    faixa();
    abrir(aba);
    document.getElementById('fc-area').innerHTML = '<p class="ss-vazio">Carregando flashcards…</p>';
    ATIVO.carregarCartoes().then(function () { montarFlashcards(); montarChecklist(); });
  });
})();

// ── Pomodoro ──
const POMO = { WORK: 25*60, SHORT: 5*60, LONG: 15*60, mode: 'work', secs: 25*60, running: false, cycle: 1, done: 0, timer: null };
function _pomoUI() {
  const m = String(Math.floor(POMO.secs/60)).padStart(2,'0'), s = String(POMO.secs%60).padStart(2,'0');
  const toggleBtn = document.getElementById('pomo-toggle');
  document.getElementById('pomo-time').textContent = `${m}:${s}`;
  document.getElementById('pomo-mode').textContent = POMO.mode==='work' ? '🎯 Foco' : POMO.mode==='short' ? '☕ Pausa 5min' : '🌸 Descanso 15min';
  document.getElementById('pomo-status').textContent = `ciclo ${POMO.cycle} de 4`;
  toggleBtn.textContent = POMO.running ? '⏸ Pausar'
    : (POMO.secs < (POMO.mode==='work'?POMO.WORK:POMO.mode==='short'?POMO.SHORT:POMO.LONG) ? '▶ Continuar' : '▶ Iniciar');
  document.getElementById('pomodoro-widget').className = 'pomodoro' + (POMO.mode==='short' ? ' break-mode' : POMO.mode==='long' ? ' long-break-mode' : '');
  document.querySelectorAll('.cycle-dot').forEach((d,i) => {
    d.classList.toggle('filled', i < POMO.done % 4);
    d.classList.toggle('active', i === POMO.done % 4 && POMO.mode === 'work');
  });
}
function _pomoNext() {
  if (POMO.mode === 'work') {
    POMO.done++; POMO.cycle = (POMO.done % 4) + 1;
    POMO.mode = POMO.done % 4 === 0 ? 'long' : 'short';
    POMO.secs = POMO.mode === 'long' ? POMO.LONG : POMO.SHORT;
  } else { POMO.mode = 'work'; POMO.secs = POMO.WORK; }
  _pomoUI();
}
function _pomoSaveSession() {
  const key = `pomo_sessions_${dataLocalHoje()}`;
  const prev = parseInt(localStorage.getItem(key) || '0');
  localStorage.setItem(key, String(prev + 1));
  try { localStorage.setItem('tj_local_rev', String(Date.now())); } catch (e) {}
  if (window._syncOAB && window._syncOAB.notificarAlteracaoLocal) { try { window._syncOAB.notificarAlteracaoLocal(key); } catch (e) {} }
  document.getElementById('pomo-status').textContent = `ciclo ${POMO.cycle} de 4 · ${prev+1} hoje`;
}
function pomoToggle() {
  POMO.running = !POMO.running;
  if (POMO.running) {
    POMO.timer = setInterval(() => {
      if (!POMO.running) return;
      if (POMO.secs > 0) { POMO.secs--; _pomoUI(); }
      else {
        clearInterval(POMO.timer); POMO.running = false;
        const isFoco = POMO.mode === 'work';
        if (isFoco) _pomoSaveSession();
        const msg = isFoco ? '✦ Foco concluído! Hora de pausar.' : 'Pausa concluída! Vamos focar.';
        _pomoNext();
        setTimeout(() => { if (confirm(msg + '\n\nIniciar próxima fase?')) pomoToggle(); }, 200);
      }
    }, 1000);
  } else clearInterval(POMO.timer);
  _pomoUI();
}
function pomoReset() { clearInterval(POMO.timer); POMO.running = false; POMO.secs = POMO.mode==='work' ? POMO.WORK : POMO.mode==='short' ? POMO.SHORT : POMO.LONG; _pomoUI(); }
function pomoSkip() { clearInterval(POMO.timer); POMO.running = false; _pomoNext(); }
_pomoUI();
(function () {
  const n = parseInt(localStorage.getItem(`pomo_sessions_${dataLocalHoje()}`) || '0');
  if (n > 0) document.getElementById('pomo-status').textContent = `ciclo 1 de 4 · ${n} hoje`;
})();
</script>
</body>
