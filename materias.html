<style>
.mat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.2rem;
}

.mat-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition);
}
.mat-card:hover { box-shadow: var(--shadow); }

.mat-header {
  padding: 1rem 1.2rem 0.8rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  cursor: pointer;
  user-select: none;
}

.mat-emoji { font-size: 1.4rem; flex-shrink: 0; }

.mat-info { flex: 1; min-width: 0; }

.mat-nome {
  font-family: 'Fraunces', serif;
  font-size: 1rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
}

.mat-sub {
  font-size: 0.7rem;
  color: var(--ink-faded);
  letter-spacing: 0.08em;
  margin-top: 0.15rem;
}

.mat-stats {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.2rem;
  flex-shrink: 0;
}

.mat-pct {
  font-family: 'Fraunces', serif;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--rose-deep);
  line-height: 1;
}

.mat-pbar {
  width: 60px;
  height: 4px;
  background: var(--line-soft);
  border-radius: 2px;
  overflow: hidden;
}
.mat-pbar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--rose), var(--rose-deep));
  border-radius: 2px;
  transition: width 0.6s ease;
}

.mat-chevron {
  font-size: 0.7rem;
  color: var(--ink-faded);
  margin-left: 0.2rem;
  transition: transform 0.2s;
}
.mat-card.open .mat-chevron { transform: rotate(90deg); }

.mat-body {
  display: none;
  padding: 0 1.2rem 1rem;
  border-top: 1px solid var(--line);
}
.mat-card.open .mat-body { display: block; }

/* Questões stats dentro da card */
.mat-q-stats {
  display: flex;
  gap: 1rem;
  padding: 0.6rem 0 0.8rem;
  font-size: 0.78rem;
  color: var(--ink-soft);
  border-bottom: 1px dotted var(--line);
  margin-bottom: 0.6rem;
}
.mat-q-num { font-family:'Fraunces',serif; font-size:1.1rem; color:var(--rose-deep); font-weight:500; }

/* Dias/tópicos */
.dia-bloco {
  margin-bottom: 0.5rem;
}

.dia-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faded);
  margin-bottom: 0.3rem;
}

.dia-badge {
  background: var(--rose-soft);
  color: var(--rose-deep);
  padding: 0.1rem 0.45rem;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.65rem;
}

.dia-badge.done {
  background: rgba(90, 152, 80, 0.15);
  color: #4a8840;
}

.topico-item {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.3rem 0;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--ink-soft);
  border-radius: 4px;
  transition: background 0.15s;
}
.topico-item:hover { background: var(--bg-soft); }

.topico-check {
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink-ghost);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem;
  color: var(--paper);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}
.topico-item.checked .topico-check {
  background: linear-gradient(135deg, #6ab870, #4a9850);
  border-color: #4a9850;
}
.topico-item.checked .topico-check::after { content: '✓'; }
.topico-item.checked { color: var(--ink-faded); text-decoration: line-through; text-decoration-color: rgba(80,160,80,0.4); }

/* Filtros */
.filter-row {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.fchip {
  padding: 0.35rem 0.85rem;
  background: var(--bg-soft);
  border: 1px solid transparent;
  border-radius: 20px;
  font-size: 0.75rem;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s;
}
.fchip:hover { background: var(--blush); }
.fchip.active {
  background: var(--rose-deep); color: #fff;
  color: var(--paper);
}

/* Totais */
.totais-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.totais-item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  text-align: center;
}
.totais-num {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  font-weight: 500;
  color: var(--rose-deep);
}
.totais-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faded); margin-top: 0.2rem; }
</style>

  matematica: ['Operações com números reais','MMC e MDC','Razão e proporção','Porcentagem','Regra de três simples e composta','Média aritmética simples e ponderada','Juros simples','Equações do 1º e 2º graus','Sistema de equações do 1º grau','Relação entre grandezas: tabelas e gráficos','Sistemas de medidas usuais','Geometria: forma, perímetro, área, volume, ângulo e teorema de Pitágoras','Resolução de situações-problema'],
  atualidades: ['Fatos políticos, econômicos, sociais e culturais, nacionais e internacionais, divulgados na mídia a partir do 1º semestre de 2026'],
  pcd: ['Lei 13.146/2015 — arts. 1º a 13','Arts. 34 a 38'],
};

let currentFilter = 'todas';

// ── Progresso pelo calendário dinâmico: cada matéria = as aulas dela no plano ──
const NOME_BANCO = {
  portugues:'Língua Portuguesa', proc_civil:'Direito Processual Civil', proc_penal:'Direito Processual Penal', penal:'Direito Penal',
  constitucional:'Direito Constitucional', administrativo:'Direito Administrativo', normas:'Normas da Corregedoria',
  interna:'Legislação Interna', informatica:'Informática', rlm:'Raciocínio Lógico', matematica:'Matemática',
  atualidades:'Atualidades', pcd:'Estatuto da Pessoa com Deficiência'
};
const K_CHECK = 'tj_ativo_check_v1';
function lerJSON(k, p) { try { return JSON.parse(localStorage.getItem(k)) || p; } catch (e) { return p; } }
function unidadesDoPlano() {
  // um item por aula e matéria; "estudado" vale pela aula
  const cal = window.CAL_ATIVO, ck = lerJSON(K_CHECK, {}), por = {}, ok = {}, lista = [];
  if (!cal) return lista;
  cal.dias.forEach(x => {
    if (x.f !== 1 || !x.top) return;
    x.top.forEach(t => {
      if (t.n == null) return;
      const k = t.n + '|' + t.d;
      let u = por[k];
      if (!u) { u = por[k] = { n: t.n, d: t.d, data: x.d, temas: [] }; lista.push(u); }
      if (u.temas.indexOf(t.s) < 0) u.temas.push(t.s);
    });
  });
  Object.keys(ck).forEach(data => {
    const c = ck[data], x = cal.dias.find(y => y.d === data);
    Object.keys(c).forEach(k => { const m = /^p(\d+)$/.exec(k); if (m && c[k]) ok[m[1]] = true; });
    if (c.feito && x && x.top) x.top.forEach(t => { if (t.n != null) ok[t.n] = true; });
  });
  lista.forEach(u => { u.ok = !!ok[u.n]; });
  return lista;
}
let UNIDADES = unidadesDoPlano();
function progPlano(matId) {
  const us = UNIDADES.filter(u => u.d === NOME_BANCO[matId]);
  const feitos = us.filter(u => u.ok).length;
  return { total: us.length, feitos, pct: us.length ? Math.round(feitos / us.length * 100) : 0, unidades: us };
}
// Questões: sessões do Tracker + questões do banco/Hoje/simulados (tj_bq_respostas), por disciplina
let Q_BANCO = null;
function questoesBanco() {
  if (Q_BANCO) return Q_BANCO;
  const resp = lerJSON('tj_bq_respostas', {}), ids = Object.keys(resp), out = { _total: { total: ids.length, acertos: 0 } };
  ids.forEach(id => { if (resp[id].ultima_correta) out._total.acertos++; });
  if (window.BANCO_QUESTOES) {
    const disc = {}; BANCO_QUESTOES.forEach(q => { disc[q.id] = q.discipline; });
    ids.forEach(id => { const d = disc[id]; if (!d) return; const o = out[d] || (out[d] = { total: 0, acertos: 0 }); o.total++; if (resp[id].ultima_correta) o.acertos++; });
    Q_BANCO = out;
  }
  return out;
}
function questoesMat(matId) {
  const t = getQuestoesPorMateria(matId), b = questoesBanco()[NOME_BANCO[matId]] || { total: 0, acertos: 0 };
  return { total: t.total + b.total, acertos: t.acertos + b.acertos };
}
function totaisQuestoes() {
  const t = getTotaisQuestoes(), b = questoesBanco()._total;
  const total = t.total + b.total, acertos = t.acertos + b.acertos;
  return { total, acertos, pct: total ? Math.round(acertos / total * 100) : 0 };
}
function togglePdf(n, data, el) {
  const ck = lerJSON(K_CHECK, {}), d = ck[data] || (ck[data] = {}), novo = !d['p' + n];
  if (novo) d['p' + n] = 1; else delete d['p' + n];
  localStorage.setItem(K_CHECK, JSON.stringify(ck));
  try { localStorage.setItem('tj_local_rev', String(Date.now())); } catch (e) {}
  if (window._syncOAB && window._syncOAB.notificarAlteracaoLocal) { try { window._syncOAB.notificarAlteracaoLocal(K_CHECK); } catch (e) {} }
  UNIDADES = unidadesDoPlano();
  const card = el.closest('.mat-card'), aberto = card && card.classList.contains('open');
  buildTotais(); renderGrid();
  if (aberto) document.getElementById(card.id).classList.add('open');
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function buildTotais() {
  const totaisQ  = totaisQuestoes();
  let topTotal = 0, topFeitos = 0;
  MATERIAS_CATALOG.forEach(m => {
    const p = progPlano(m.id);
    topTotal  += p.total;
    topFeitos += p.feitos;
  });
  const topPct = topTotal > 0 ? Math.round((topFeitos/topTotal)*100) : 0;

  document.getElementById('totais-bar').innerHTML = `
    <div class="totais-item">
      <div class="totais-num">${topPct}%</div>
      <div class="totais-label">Aulas estudadas</div>
    </div>
    <div class="totais-item">
      <div class="totais-num">${totaisQ.total}</div>
      <div class="totais-label">Questões feitas</div>
    </div>
    <div class="totais-item">
      <div class="totais-num" style="color:${totaisQ.pct>=70?'#4a9850':totaisQ.pct>=50?'#c9960a':'#c05050'}">${totaisQ.pct}%</div>
      <div class="totais-label">Acertos médios</div>
    </div>`;
}

function renderGrid() {
  const grid = document.getElementById('mat-grid');
  let html = '';

  MATERIAS_CATALOG.forEach(mat => {
    const prog   = progPlano(mat.id);
    const qStats = questoesMat(mat.id);
    const qPct   = qStats.total > 0 ? Math.round((qStats.acertos/qStats.total)*100) : null;
    const pct    = prog.pct;

    const estado = pct === 0 ? 'pendente' : pct === 100 ? 'concluida' : 'em_andamento';
    if (currentFilter !== 'todas' && currentFilter !== estado) return;

    // Corpo dos dias/tópicos
    let diasHtml = '';
    prog.unidades.forEach(u => {
      const [ano, mes, dd] = u.data.split('-');
      diasHtml += `<div class="dia-bloco">
        <div class="dia-label">
          <span class="dia-badge ${u.ok?'done':''}">Aula ${u.n} do plano</span>
          <a href="hoje.html?data=${u.data}" style="color:inherit">${dd}/${mes}</a>
        </div>
        <div class="topico-item ${u.ok?'checked':''}" onclick="togglePdf(${u.n},'${u.data}',this)">
          <span class="topico-check"></span>
          <span>${u.temas.join('; ')}</span>
        </div>
      </div>`;
    });

    {
      // Edital verticalizado da matéria, com checkboxes persistidos
      const curriculo = TOPICOS_CURRICULO[mat.id] || [];
      if (curriculo.length) {
        const savedKey = 'curric_' + mat.id;
        const saved = JSON.parse(localStorage.getItem(savedKey) || '{}');
        const checkedCount = Object.values(saved).filter(Boolean).length;
        diasHtml += `<div class="curric-block" id="curric-${mat.id}" style="margin-top:.8rem">
          <div style="font-size:0.65rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faded);margin-bottom:0.5rem">Edital verticalizado · ${checkedCount}/${curriculo.length} estudados</div>
          ${curriculo.map((t, tIdx) => {
            const checked = !!saved[tIdx];
            return `<div class="topico-item ${checked ? 'checked' : ''}" onclick="toggleCurricTopico('${mat.id}',${tIdx},this)" style="display:flex;align-items:flex-start;gap:0.6rem;padding:0.4rem 0;border-bottom:1px dotted var(--line);cursor:pointer;transition:opacity 0.15s">
              <span class="topico-check" style="width:16px;height:16px;flex-shrink:0;border:1.5px solid ${checked ? 'var(--rose)' : 'var(--ink-ghost)'};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:white;margin-top:2px;background:${checked ? 'linear-gradient(135deg,var(--rose),var(--rose-deep))' : 'transparent'};transition:all .15s">${checked ? '✓' : ''}</span>
              <span style="font-size:0.83rem;color:${checked ? 'var(--ink-ghost)' : 'var(--ink-soft)'};text-decoration:${checked ? 'line-through' : 'none'};line-height:1.4">${t}</span>
            </div>`;
          }).join('')}
        </div>`;
      } else if (!diasHtml) {
        diasHtml = `<div style="color:var(--ink-faded);font-size:0.8rem;padding:0.5rem 0;font-style:italic">Tópicos serão exibidos conforme os PDFs forem extraídos.</div>`;
      }
    }

    const qBar = qStats.total > 0 ? `
      <div class="mat-q-stats">
        <div><div class="mat-q-num">${qStats.total}</div><div style="font-size:0.65rem;color:var(--ink-faded)">QUESTÕES</div></div>
        <div><div class="mat-q-num">${qStats.acertos}</div><div style="font-size:0.65rem;color:var(--ink-faded)">ACERTOS</div></div>
        <div><div class="mat-q-num" style="color:${qPct>=70?'#4a9850':qPct>=50?'#c9960a':'#c05050'}">${qPct}%</div><div style="font-size:0.65rem;color:var(--ink-faded)">TAXA</div></div>
        <div style="margin-left:auto;font-size:0.7rem;color:var(--ink-faded)">${mat.prova}</div>
      </div>` : `<div style="font-size:0.72rem;color:var(--ink-faded);padding:0.5rem 0 0.3rem;border-bottom:1px dotted var(--line);margin-bottom:0.3rem">Na prova: ${mat.prova}</div>`;

    html += `<div class="mat-card" id="matcard-${mat.id}">
      <div class="mat-header" onclick="toggleCard('${mat.id}')">
        <span class="mat-emoji">${mat.emoji}</span>
        <div class="mat-info">
          <div class="mat-nome">${mat.nome}</div>
          <div class="mat-sub" id="matsub-${mat.id}">${prog.total > 0 ? prog.feitos+'/'+prog.total+(prog.total===1?' PDF':' PDFs') : (TOPICOS_CURRICULO[mat.id]||[]).length + ' tópicos para estudar por fora'}${qStats.total>0?' · '+qStats.total+' questões':''}</div>
        </div>
        <div class="mat-stats">
          <div class="mat-pct" id="matpct-${mat.id}">${pct}%</div>
          <div class="mat-pbar"><div class="mat-pbar-fill" id="matbar-${mat.id}" style="width:${pct}%"></div></div>
        </div>
        <span class="mat-chevron">›</span>
      </div>
      <div class="mat-body">
        ${qBar}
        ${diasHtml}
        <div style="margin-top:0.8rem;padding-top:0.8rem;border-top:1px dotted var(--line)">
          <div style="font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faded);margin-bottom:0.4rem">◎ Registrar questões desta matéria</div>
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:0.4rem;align-items:center">
            <input type="number" placeholder="Total" min="1" id="qinput-t-${mat.id}"
              style="background:var(--bg-soft);border:1px solid var(--line);padding:0.4rem 0.6rem;border-radius:var(--radius-sm);font-size:1rem;color:var(--ink);font-family:inherit">
            <input type="number" placeholder="Acertos" min="0" id="qinput-a-${mat.id}"
              style="background:var(--bg-soft);border:1px solid var(--line);padding:0.4rem 0.6rem;border-radius:var(--radius-sm);font-size:1rem;color:var(--ink);font-family:inherit">
            <button class="btn btn-primary" style="font-size:0.72rem;padding:0.4rem 0.8rem;white-space:nowrap" onclick="registrarQuestoesMat('${mat.id}')">Registrar</button>
          </div>
          <div id="qfb-${mat.id}" style="font-size:0.75rem;margin-top:0.3rem;min-height:1em;color:var(--ink-soft)"></div>
        </div>
      </div>
    </div>`;
  });

  grid.innerHTML = html || '<div style="color:var(--ink-faded);text-align:center;padding:2rem">Nenhuma matéria neste filtro.</div>';
}

function toggleCard(id) {
  const card = document.getElementById('matcard-' + id);
  if (card) card.classList.toggle('open');
}

function toggleCurricTopico(matId, tIdx, rowEl) {
  const savedKey = 'curric_' + matId;
  const saved = JSON.parse(localStorage.getItem(savedKey) || '{}');
  saved[tIdx] = !saved[tIdx];
  localStorage.setItem(savedKey, JSON.stringify(saved));
  try { localStorage.setItem('tj_local_rev', String(Date.now())); } catch (e) {}
  if (window._syncOAB && window._syncOAB.notificarAlteracaoLocal) {
    try { window._syncOAB.notificarAlteracaoLocal(savedKey); } catch (e) {}
  }

  const checked = saved[tIdx];
  rowEl.classList.toggle('checked', checked);
  const checkEl = rowEl.querySelector('.topico-check');
  const textEl  = rowEl.querySelector('span:last-child');
  if (checkEl) {
    checkEl.textContent = checked ? '✓' : '';
    checkEl.style.background = checked ? 'linear-gradient(135deg,var(--rose),var(--rose-deep))' : 'transparent';
    checkEl.style.borderColor = checked ? 'var(--rose)' : 'var(--ink-ghost)';
  }
  if (textEl) {
    textEl.style.color = checked ? 'var(--ink-ghost)' : 'var(--ink-soft)';
    textEl.style.textDecoration = checked ? 'line-through' : 'none';
  }

  // Actualiza header
  const block = document.getElementById('curric-' + matId);
  if (block) {
    const curriculo = TOPICOS_CURRICULO[matId] || [];
    const checkedCount = Object.values(saved).filter(Boolean).length;
    const label = block.querySelector('div:first-child');
    if (label) label.textContent = `Edital verticalizado · ${checkedCount}/${curriculo.length} estudados`;
    // Update card pct display
    const card = document.getElementById('matcard-' + matId);
    if (card && curriculo.length) {
      const pct = Math.round((checkedCount / curriculo.length) * 100);
      const pctEl = card.querySelector('.mat-pct');
      const barEl = card.querySelector('.mat-pbar-fill');
      const subEl = document.getElementById('matsub-' + matId);
      if (pctEl) pctEl.textContent = pct + '%';
      if (barEl) barEl.style.width = pct + '%';
      if (subEl) subEl.textContent = `${checkedCount}/${curriculo.length} tópicos`;
    }
  }
}

function toggleTopico(dia, mIdx, tIdx, el) {
  const novo = toggleTopicoManual(dia, mIdx, tIdx);
  el.classList.toggle('checked', novo);
  // Actualiza pct no header
  const mat = PLANO_OAB[dia-1]?.materias[mIdx];
  if (mat) {
    const matId = getMateriaId(mat.nome);
    const card  = document.getElementById('matcard-' + matId);
    if (card) {
      const prog = getProgressoMateria(matId);
      const pctEl = card.querySelector('.mat-pct');
      const barEl = card.querySelector('.mat-pbar-fill');
      const subEl = card.querySelector('.mat-sub');
      if (pctEl) pctEl.textContent = prog.pct + '%';
      if (barEl) barEl.style.width = prog.pct + '%';
      if (subEl) subEl.textContent = `${prog.feitos}/${prog.total} tópicos`;
    }
  }
  buildTotais();
}

function registrarQuestoesMat(matId) {
  const total   = parseInt(document.getElementById(`qinput-t-${matId}`)?.value) || 0;
  const acertos = parseInt(document.getElementById(`qinput-a-${matId}`)?.value);
  const fb      = document.getElementById(`qfb-${matId}`);

  if (total <= 0) { if (fb) { fb.textContent = '⚠ Informe o total'; fb.style.color='var(--rose-deep)'; } return; }
  if (isNaN(acertos) || acertos < 0 || acertos > total) { if (fb) { fb.textContent = '⚠ Acertos inválido'; fb.style.color='var(--rose-deep)'; } return; }

  registrarQuestoes(matId, total, acertos);

  document.getElementById(`qinput-t-${matId}`).value = '';
  document.getElementById(`qinput-a-${matId}`).value = '';

  const pct = Math.round((acertos / total) * 100);
  if (fb) {
    fb.textContent = `✓ ${acertos}/${total} (${pct}%) — registrado`;
    fb.style.color = pct >= 70 ? '#4a9850' : 'var(--ink-soft)';
    setTimeout(() => { if (fb) fb.textContent = ''; }, 3000);
  }

  // Atualiza o sub-header do card sem re-renderizar tudo
  const qStats = questoesMat(matId);
  const prog   = progPlano(matId);
  const subEl  = document.getElementById(`matsub-${matId}`);
  if (subEl && prog.total) subEl.textContent = `${prog.feitos}/${prog.total} ${prog.total === 1 ? 'PDF' : 'PDFs'} · ${qStats.total} questões`;

  buildTotais();
}

document.addEventListener('DOMContentLoaded', () => {
  buildTotais();
  renderGrid();
  // questões do banco por matéria: o banco é grande, carrega depois e redesenha
  if (Object.keys(lerJSON('tj_bq_respostas', {})).length && !window.BANCO_QUESTOES) {
    const sc = document.createElement('script');
    sc.src = 'questoes-banco.js';
    sc.onload = () => { Q_BANCO = null; const abertos = [...document.querySelectorAll('.mat-card.open')].map(c => c.id); buildTotais(); renderGrid(); abertos.forEach(id => { const c = document.getElementById(id); if (c) c.classList.add('open'); }); };
    document.head.appendChild(sc);
  }
});
</script>
</body>
</html>
