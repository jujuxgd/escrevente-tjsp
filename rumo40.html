<style>
.r40-hero{display:grid;grid-template-columns:auto 1fr;gap:1.6rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.5rem 1.7rem;box-shadow:var(--shadow-sm);margin-bottom:1.6rem}
.r40-nota{font-family:'Fraunces',serif;font-weight:500;font-size:3.6rem;line-height:1;color:var(--ink);letter-spacing:-.03em}
.r40-nota small{font-size:1.2rem;color:var(--ink-faded);letter-spacing:0}
.r40-eb{font:500 .64rem Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faded);margin-bottom:.4rem}
.r40-selo{display:inline-block;border-radius:999px;padding:.3rem .8rem;font:600 .76rem Inter,sans-serif;margin-bottom:.6rem}
.r40-selo.ok{background:var(--sage);color:var(--ink)}
.r40-selo.nao{background:var(--champagne);color:var(--ink)}
.r40-hero p{font-size:.84rem;color:var(--ink-soft);line-height:1.55;margin:0}
.r40-regua{position:relative;height:8px;background:var(--line);border-radius:8px;margin:.9rem 0 .35rem;overflow:visible}
.r40-regua i{position:absolute;left:0;top:0;bottom:0;background:var(--rose);border-radius:8px}
.r40-regua b{position:absolute;top:-5px;width:2px;height:18px;background:var(--ink)}
.r40-regua-leg{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-faded)}
.r40-sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.8rem 0 .9rem}
.r40-sec h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.3rem;color:var(--ink);margin:0}
.r40-sec span{font-size:.78rem;color:var(--ink-faded)}
.r40-top{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.9rem}
.r40-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:.5rem}
.r40-card h3{font-family:'Fraunces',serif;font-weight:500;font-size:1.05rem;color:var(--ink);margin:0}
.r40-ganho{font-family:'Fraunces',serif;font-size:1.6rem;color:var(--ink);line-height:1}
.r40-ganho small{font:400 .74rem Inter,sans-serif;color:var(--ink-faded);margin-left:.3rem}
.r40-meta{font-size:.76rem;color:var(--ink-soft)}
.r40-card .btn{align-self:flex-start;text-decoration:none;font-size:.78rem;margin-top:auto}
.r40-tab{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.r40-lin{display:grid;grid-template-columns:minmax(150px,1.4fr) 70px minmax(120px,1.6fr) 90px auto;gap:.8rem;align-items:center;padding:.7rem 1.1rem;border-bottom:1px solid var(--line-soft,var(--line));font-size:.82rem;color:var(--ink)}
.r40-lin:last-child{border-bottom:0}
.r40-lin.cab{font:500 .64rem Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faded);background:var(--bg)}
.r40-barra{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.r40-barra i{display:block;height:100%;border-radius:6px;background:var(--rose)}
.r40-pct{font-size:.72rem;color:var(--ink-faded);margin-top:.25rem}
.r40-lin a{font-size:.76rem;color:var(--ink-soft);text-decoration:none;white-space:nowrap}
.r40-lin a:hover{color:var(--ink);text-decoration:underline}
.r40-extra.atual{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.r40-tag{align-self:flex-start;font:600 .62rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--rose-soft);color:var(--ink);border-radius:999px;padding:.2rem .6rem}
.r40-nota-rod{font-size:.76rem;color:var(--ink-faded);line-height:1.6;margin-top:1.6rem}
.r40-vazio{padding:1rem 0;color:var(--ink-soft);font-size:.86rem}
@media (max-width:700px){
  .r40-hero{grid-template-columns:1fr;gap:.8rem;padding:1.2rem}
  .r40-nota{font-size:3rem}
  .r40-lin{grid-template-columns:1fr auto;gap:.3rem .8rem}
  .r40-lin.cab{display:none}
  .r40-lin .peso{display:none}
  .r40-lin .acerto{grid-column:1/-1;order:3}
  .r40-lin a{order:4;grid-column:1/-1}
}
</style>

<script>
(function () {
  var BANCO = window.BANCO_QUESTOES || [];
  var META = 0.75;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function fmt(x) { return (Math.round(x * 10) / 10).toString().replace('.', ','); }

  function render() {
    var el = document.getElementById('r40');
    if (!BANCO.length) { el.innerHTML = '<p class="r40-vazio">O banco de questões do TJSP ainda está sendo montado. Assim que as provas anteriores entrarem, este painel mostra sua nota provável e onde estão os pontos mais fáceis.</p>'; return; }
    var pesos = ESTUDO.pesosRecentes(BANCO, 41);
    var st = ESTUDO.statsPorDisciplina(BANCO);
    var linhas = Object.keys(pesos).map(function (d) {
      var s = st[d] || { total: 0, n: 0, ac: 0 };
      var est = ESTUDO.acertoEstimado(s);
      return { d: d, peso: pesos[d], s: s, est: est, pontos: pesos[d] * est, ganho: pesos[d] * Math.max(0, META - est) };
    });
    var nota = linhas.reduce(function (a, l) { return a + l.pontos; }, 0);
    var totalProva = linhas.reduce(function (a, l) { return a + l.peso; }, 0);
    var respondidas = linhas.reduce(function (a, l) { return a + l.s.n; }, 0);
    var semDados = linhas.filter(function (l) { return l.s.n < 5; }).length;
    var notaR = Math.round(nota);
    var acima = notaR >= 40;

    var h = '<div class="r40-hero"><div><div class="r40-eb">Nota provável hoje</div><div class="r40-nota">' + (respondidas ? notaR : '—') + '<small> / ' + Math.round(totalProva) + '</small></div></div>' +
      '<div><span class="r40-selo ' + (!respondidas ? '' : acima ? 'ok' : 'nao') + '">' + (!respondidas ? 'Ainda sem dados' : notaR === 40 ? 'Exatamente no corte' : acima ? 'Acima do corte por ' + (notaR - 40) + (notaR - 40 === 1 ? ' ponto' : ' pontos') : 'Falta' + (40 - notaR === 1 ? ' 1 ponto' : 'm ' + (40 - notaR) + ' pontos') + ' para o corte') + '</span>' +
      '<div class="r40-regua"><i style="width:' + (respondidas ? Math.min(100, nota / totalProva * 100) : 0) + '%"></i><b style="left:' + (40 / totalProva * 100) + '%"></b></div>' +
      '<div class="r40-regua-leg"><span>0</span><span>corte 40</span><span>' + Math.round(totalProva) + '</span></div>' +
      '<p style="margin-top:.7rem">' + (!respondidas ? 'Resolva questões no Banco, no Hoje ou num Simulado para ver sua nota provável. ' : '') + 'Baseada em <b>' + respondidas + '</b> ' + (respondidas === 1 ? 'questão respondida' : 'questões respondidas') + ' e no peso de cada matéria nas provas mais recentes (41º ao 47º exame).' +
      (semDados ? ' ' + semDados + ' matérias ainda têm menos de 5 respostas, então contam perto de 50% até você resolver mais.' : '') + '</p></div></div>';

    var top = linhas.filter(function (l) { return l.ganho >= 0.25; }).sort(function (a, b) { return b.ganho - a.ganho; }).slice(0, 3);
    h += '<div class="r40-sec"><h2>Pontos mais baratos</h2><span>quanto você ganha levando a matéria a 75% de acerto</span></div>';
    h += top.length ? '<div class="r40-top">' + top.map(function (l) {
      return '<div class="r40-card"><h3>' + esc(l.d) + '</h3><div class="r40-ganho">+' + fmt(l.ganho) + '<small>pontos possíveis</small></div>' +
        '<div class="r40-meta">Cai ' + fmt(l.peso) + '× por prova · ' + (l.s.n ? 'você acerta ' + pct(l.s.ac / l.s.n) + ' (' + l.s.ac + ' de ' + l.s.n + ')' : 'sem respostas ainda') + '</div>' +
        '<a class="btn btn-primary" href="' + ESTUDO.linkBanco(l.d, l.s.n - l.s.ac > 0 ? 'errei' : 'nao') + '">' + (l.s.n - l.s.ac > 0 ? 'Refazer as que errei →' : 'Resolver questões →') + '</a></div>';
    }).join('') + '</div>' : '<p class="r40-vazio">Todas as matérias já estão perto de 75%. Mantenha o ritmo.</p>';

    h += '<div class="r40-sec"><h2>Todas as matérias</h2><span>da que mais rende para a que menos rende</span></div><div class="r40-tab">' +
      '<div class="r40-lin cab"><span>Matéria</span><span class="peso">Na prova</span><span>Seu acerto</span><span>Ganho</span><span></span></div>' +
      linhas.slice().sort(function (a, b) { return b.ganho - a.ganho || b.peso - a.peso; }).map(function (l) {
        var real = l.s.n ? l.s.ac / l.s.n : 0;
        return '<div class="r40-lin"><span>' + esc(l.d) + '</span><span class="peso">' + fmt(l.peso) + ' q.</span>' +
          '<span class="acerto"><div class="r40-barra"><i style="width:' + Math.round(real * 100) + '%"></i></div><div class="r40-pct">' +
          (l.s.n ? pct(real) + ' · ' + l.s.ac + ' de ' + l.s.n + ' (' + l.s.total + ' no banco)' : 'nenhuma resolvida · ' + l.s.total + ' no banco') + '</div></span>' +
          '<span>' + (l.ganho >= 0.05 ? '+' + fmt(l.ganho) + ' pts' : '—') + '</span>' +
          '<a href="' + ESTUDO.linkBanco(l.d, 'nao') + '">Resolver →</a></div>';
      }).join('') + '</div>';

    var atual = ESTUDO.extraDaSemana();
    h += '<div class="r40-sec"><h2>Matérias fora do plano</h2><span>não aparecem nos 120 dias, mas valem 10 questões por prova — uma por semana</span></div><div class="r40-top">' +
      ESTUDO.EXTRAS.map(function (d) {
        var s = st[d] || { total: 0, n: 0, ac: 0 };
        return '<div class="r40-card r40-extra' + (d === atual ? ' atual' : '') + '">' + (d === atual ? '<span class="r40-tag">Desta semana</span>' : '') +
          '<h3>' + esc(d) + '</h3><div class="r40-meta">' + s.n + ' de ' + s.total + ' questões resolvidas' + (s.n ? ' · acerto ' + pct(s.ac / s.n) : '') + '</div>' +
          '<div class="r40-barra"><i style="width:' + (s.total ? Math.round(s.n / s.total * 100) : 0) + '%"></i></div>' +
          '<a class="btn' + (d === atual ? ' btn-primary' : '') + '" href="' + ESTUDO.linkBanco(d, 'nao') + '">Resolver →</a></div>';
      }).join('') + '</div>';

    h += '<p class="r40-nota-rod">Contam as questões resolvidas no Banco e os simulados feitos no app daqui em diante. Registros feitos só no Tracker de questões ' +
      'não entram, porque não dizem quais questões foram. Para cada matéria vale a última resposta de cada questão.</p>';
    el.innerHTML = h;
  }

  render();
})();
</script>
